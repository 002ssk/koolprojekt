name: Deploy to Zone Media

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH and rsync
        env:
          SSH_SERVER: ${{ secrets.SSH_SERVER }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H "$SSH_SERVER" >> ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host $SSH_SERVER
            User $SSH_USERNAME
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF
          chmod 600 ~/.ssh/config

          remote="$SSH_SERVER"
          deploy_path=/data01/virt150871/domeenid/www.sskworks.eu/htdocs

          ssh "$remote" 'command -v rsync >/dev/null || { echo "rsync is not installed on the server" >&2; exit 127; }'
          ssh "$remote" "mkdir -p '$deploy_path'"
          rsync -az --delete \
            --exclude='.git*' \
            --exclude='.github*' \
            -e ssh \
            ./ "$remote:$deploy_path/"
